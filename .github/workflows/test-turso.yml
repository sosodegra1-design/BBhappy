name: Test Turso connection

on:
  workflow_dispatch:

jobs:
  test-turso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - run: npm install

      - name: Connect to Turso and verify schema
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node -e "
          if (!process.env.TURSO_DATABASE_URL) {
            console.error('❌ TURSO_DATABASE_URL secret is not set on this repository.');
            process.exit(1);
          }
          const db = require('./server/db');
          (async () => {
            await db.init();
            const res = await db.client.execute('SELECT 1 AS ok');
            if (res.rows[0].ok === 1) {
              console.log('✅ Connected to Turso and verified/created the schema successfully.');
            } else {
              console.error('❌ Unexpected query result.');
              process.exit(1);
            }
          })().catch(err => {
            console.error('❌ Turso connection failed:', err.message);
            process.exit(1);
          });
          "
