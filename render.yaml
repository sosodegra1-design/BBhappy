services:
  - type: web
    name: bbhappy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Shared secret for the /api/admin/* write routes. If it is absent, those
      # routes refuse every request (fail closed) rather than defaulting open.
      - key: ADMIN_API_KEY
        sync: false
